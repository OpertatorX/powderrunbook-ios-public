name: PowderRunbook
options:
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  bundleIdPrefix: com.operatorx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  PowderRunbook:
    type: application
    platform: iOS
    sources:
      - path: PowderRunbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.operatorx.powderrunbook
        INFOPLIST_FILE: PowderRunbook/Info.plist
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - PowderRunbookTests
  PowderRunbookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PowderRunbookTests
    dependencies:
      - target: PowderRunbook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
