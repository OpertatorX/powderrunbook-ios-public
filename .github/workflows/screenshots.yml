name: App Store Screenshots

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build simulator app
        run: |
          xcodebuild \
            -project PowderRunbook.xcodeproj \
            -scheme PowderRunbook \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0 \
            build
      - name: Select stable simulators
        id: devices
        run: |
          DEVICES=$(xcrun simctl list devices available -j)
          IPHONE=$(echo "$DEVICES" | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[x for r in d.values() for x in r if x.get("isAvailable") and x.get("name","").startswith("iPhone")]; print(a[0]["udid"])')
          IPAD=$(echo "$DEVICES" | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[x for r in d.values() for x in r if x.get("isAvailable") and x.get("name","").startswith("iPad")]; print(a[0]["udid"])')
          echo "iphone=$IPHONE" >> "$GITHUB_OUTPUT"
          echo "ipad=$IPAD" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep -E "$IPHONE|$IPAD" || true
      - name: Prepare folders and helper
        run: |
          mkdir -p screenshots/en-US/iphone screenshots/fr-FR/iphone screenshots/en-US/ipad screenshots/fr-FR/ipad
          cat > "$RUNNER_TEMP/wait_boot.sh" <<'SH'
          #!/bin/bash
          set -euo pipefail
          UDID="$1"
          for i in $(seq 1 60); do
            if xcrun simctl list devices | grep "$UDID" | grep -q '(Booted)'; then
              echo "Simulator $UDID is Booted"
              exit 0
            fi
            sleep 2
          done
          echo "Simulator $UDID did not reach Booted state" >&2
          xcrun simctl list devices | grep "$UDID" || true
          exit 1
          SH
          chmod +x "$RUNNER_TEMP/wait_boot.sh"
      - name: Capture iPhone FR and US
        env:
          UDID: ${{ steps.devices.outputs.iphone }}
        run: |
          set -euo pipefail
          APP="$PWD/DerivedData/Build/Products/Debug-iphonesimulator/PowderRunbook.app"
          xcrun simctl shutdown all || true
          xcrun simctl boot "$UDID" || true
          "$RUNNER_TEMP/wait_boot.sh" "$UDID"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time '9:41' --batteryLevel 100 --batteryState charged --wifiBars 3 --cellularBars 4 || true
          capture_locale () {
            LOCALE="$1"; LANG="$2"; OUT="$3"
            for SCREEN in jobs detail inventory overview settings; do
              xcrun simctl terminate "$UDID" com.operatorx.powderrunbook || true
              xcrun simctl launch "$UDID" com.operatorx.powderrunbook -AppleLanguages "($LANG)" -AppleLocale "$LOCALE" -store-demo "-screen=$SCREEN"
              sleep 2
              xcrun simctl io "$UDID" screenshot "$OUT/$SCREEN.png"
            done
          }
          capture_locale 'en_US' 'en' 'screenshots/en-US/iphone'
          capture_locale 'fr_FR' 'fr' 'screenshots/fr-FR/iphone'
          xcrun simctl shutdown "$UDID" || true
      - name: Capture iPad FR and US
        env:
          UDID: ${{ steps.devices.outputs.ipad }}
        run: |
          set -euo pipefail
          APP="$PWD/DerivedData/Build/Products/Debug-iphonesimulator/PowderRunbook.app"
          xcrun simctl boot "$UDID" || true
          "$RUNNER_TEMP/wait_boot.sh" "$UDID"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time '9:41' --batteryLevel 100 --batteryState charged --wifiBars 3 || true
          capture_locale () {
            LOCALE="$1"; LANG="$2"; OUT="$3"
            for SCREEN in jobs detail inventory overview settings; do
              xcrun simctl terminate "$UDID" com.operatorx.powderrunbook || true
              xcrun simctl launch "$UDID" com.operatorx.powderrunbook -AppleLanguages "($LANG)" -AppleLocale "$LOCALE" -store-demo "-screen=$SCREEN"
              sleep 2
              xcrun simctl io "$UDID" screenshot "$OUT/$SCREEN.png"
            done
          }
          capture_locale 'en_US' 'en' 'screenshots/en-US/ipad'
          capture_locale 'fr_FR' 'fr' 'screenshots/fr-FR/ipad'
          xcrun simctl shutdown "$UDID" || true
      - name: Validate screenshot set
        run: |
          set -euo pipefail
          COUNT=$(find screenshots -name '*.png' | wc -l | tr -d ' ')
          test "$COUNT" -eq 20
          find screenshots -name '*.png' -print0 | while IFS= read -r -d '' file; do
            echo "$file"
            sips -g pixelWidth -g pixelHeight "$file" | tail -n +2
          done
      - uses: actions/upload-artifact@v4
        with:
          name: powderrunbook-real-screenshots
          path: screenshots
          retention-days: 14
