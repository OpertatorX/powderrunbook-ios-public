name: App Store Screenshots

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build simulator app
        run: |
          xcodebuild \
            -project PowderRunbook.xcodeproj \
            -scheme PowderRunbook \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Select 6.9-inch iPhone and 13-inch iPad
        id: devices
        run: |
          DEVICES=$(xcrun simctl list devices available -j)
          IPHONE=$(echo "$DEVICES" | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[x for r in d.values() for x in r if x.get("isAvailable") and x.get("name","").startswith("iPhone")]; p=[x for x in a if "Pro Max" in x["name"]]; print((p or a)[-1]["udid"])')
          IPAD=$(echo "$DEVICES" | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[x for r in d.values() for x in r if x.get("isAvailable") and x.get("name","").startswith("iPad")]; p=[x for x in a if "13-inch" in x["name"]]; print((p or a)[-1]["udid"])')
          echo "iphone=$IPHONE" >> "$GITHUB_OUTPUT"
          echo "ipad=$IPAD" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep -E "$IPHONE|$IPAD" || true
      - name: Boot and install
        run: |
          APP="$PWD/DerivedData/Build/Products/Release-iphonesimulator/PowderRunbook.app"
          for UDID in '${{ steps.devices.outputs.iphone }}' '${{ steps.devices.outputs.ipad }}'; do
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
          done
      - name: Capture real localized app screens
        run: |
          mkdir -p screenshots/en-US/iphone screenshots/fr-FR/iphone screenshots/en-US/ipad screenshots/fr-FR/ipad
          capture () {
            UDID="$1"; LOCALE="$2"; LANG="$3"; OUT="$4"
            for SCREEN in jobs detail inventory overview settings; do
              xcrun simctl terminate "$UDID" com.operatorx.powderrunbook || true
              xcrun simctl launch "$UDID" com.operatorx.powderrunbook \
                -AppleLanguages "($LANG)" \
                -AppleLocale "$LOCALE" \
                -store-demo \
                "-screen=$SCREEN"
              sleep 2
              xcrun simctl io "$UDID" screenshot "$OUT/$SCREEN.png"
            done
          }
          capture '${{ steps.devices.outputs.iphone }}' 'en_US' 'en' 'screenshots/en-US/iphone'
          capture '${{ steps.devices.outputs.iphone }}' 'fr_FR' 'fr' 'screenshots/fr-FR/iphone'
          capture '${{ steps.devices.outputs.ipad }}' 'en_US' 'en' 'screenshots/en-US/ipad'
          capture '${{ steps.devices.outputs.ipad }}' 'fr_FR' 'fr' 'screenshots/fr-FR/ipad'
      - name: Record screenshot dimensions
        run: |
          find screenshots -name '*.png' -print0 | while IFS= read -r -d '' file; do
            echo "$file"
            sips -g pixelWidth -g pixelHeight "$file" | tail -n +2
          done
      - uses: actions/upload-artifact@v4
        with:
          name: powderrunbook-real-screenshots
          path: screenshots
          retention-days: 14
